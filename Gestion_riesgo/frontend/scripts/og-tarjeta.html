<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
	@page { margin: 0 }
	* { box-sizing: border-box; margin: 0; padding: 0 }

	body {
		width: 1200px; height: 630px;
		font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
		display: flex; flex-direction: column;
		background: #0d2b4e;
	}

	.principal {
		flex: 1;
		display: flex; align-items: center; gap: 52px;
		padding: 0 76px;
		background:
			radial-gradient(1100px 520px at 78% -8%, rgba(21,119,214,.45), transparent 62%),
			linear-gradient(160deg, #123a63 0%, #0d2b4e 52%, #0a2140 100%);
		position: relative;
	}

	/* Retícula tenue: evoca la cuadrícula de un plano sin competir con el texto. */
	.principal::before {
		content: ""; position: absolute; inset: 0;
		background-image:
			linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
			linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
		background-size: 64px 64px;
	}

	.escudo {
		width: 176px; flex: 0 0 auto; position: relative;
		filter: drop-shadow(0 10px 26px rgba(0,0,0,.4));
	}

	.texto { position: relative; min-width: 0 }

	.entidad {
		font-size: 20px; font-weight: 700; letter-spacing: .17em;
		text-transform: uppercase; color: #7fb6ee; margin-bottom: 20px;
	}

	h1 {
		font-size: 78px; line-height: 1.02; font-weight: 800;
		letter-spacing: -.022em; color: #fff; margin-bottom: 8px;
	}

	.gestion { color: #6fc0ff }

	.lema {
		font-size: 27px; line-height: 1.34; color: #c3d8ef;
		font-weight: 500; margin-top: 22px; max-width: 640px;
	}

	.pie {
		flex: 0 0 84px;
		display: flex; align-items: center; justify-content: center; gap: 18px;
		background: #f2b705;
		color: #17324f; font-size: 23px; font-weight: 700; letter-spacing: .012em;
	}

	.punto { width: 7px; height: 7px; border-radius: 50%; background: #17324f; opacity: .5 }
</style></head>
<body>
	<div class="principal">
		<img class="escudo" src="escudo.svg" alt="">
		<div class="texto">
			<div class="entidad">Alcaldía Municipal de Jamundí</div>
			<h1>Sistema de<br><span class="gestion">Gestión del Riesgo</span></h1>
			<div class="lema">Registro, seguimiento y mapa de la afectación por emergencias en el municipio.</div>
		</div>
	</div>
	<div class="pie">
		<span>Alcaldía de Jamundí</span><span class="punto"></span>
		<span>Oficina TIC</span><span class="punto"></span>
		<span>grj.oticjamundi.com</span>
	</div>
</body></html>
